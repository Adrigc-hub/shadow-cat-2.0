<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Cat: Jujutsu Chronicles</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .pantalla {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }
        .pantalla.activa {
            display: flex;
        }
        .zona-interactiva {
            pointer-events: auto;
        }
        .titulo-juego {
            font-size: 26px;
            color: #ff3c3c;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 60, 60, 0.6);
            margin-bottom: 170px;
            text-align: center;
        }
        .contenedor-botones {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .btn-menu {
            width: 260px;
            height: 45px;
            background: rgba(0, 255, 130, 0.02);
            border: 1px solid rgba(0, 255, 130, 0.1);
            color: #00ff82;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-menu:active {
            background: rgba(0, 255, 130, 0.15);
        }
        #hud-juego {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            color: #fff;
        }
        .btn-pausa {
            background: #ff3c3c;
            border: none;
            color: white;
            padding: 5px 12px;
            font-weight: bold;
            pointer-events: auto;
        }
        #menu-pausa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 5, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            color: white;
        }
        #contenedor-hechiceros {
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: auto;
        }
        .item-habilidad {
            width: 260px;
            padding: 12px;
            background: rgba(163, 51, 255, 0.1);
            border: 1px solid #a333ff;
            color: white;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="canvasJuego"></canvas>

    <div id="hud-juego">
        <div>Puntos: <span id="txt-puntos">0</span></div>
        <button class="btn-pausa" onclick="activarPausa(true)">PAUSA</button>
    </div>

    <div id="pantalla-menu" class="pantalla">
        <div class="titulo-juego">SHADOW CAT:<br>JUJUTSU CHRONICLES</div>
        <div class="contenedor-botones zona-interactiva">
            <div class="btn-menu" onclick="cambiarPantalla('juego-original')">MODO ORIGINAL</div>
            <div class="btn-menu" onclick="cambiarPantalla('juego-ritmo')">DANCE OF FIRE</div>
            <div class="btn-menu" onclick="cambiarPantalla('juego-shoot')">SHOOT THE BOX</div>
            <div class="btn-menu" onclick="cambiarPantalla('hechiceros')">HECHICEROS (SKINS)</div>
        </div>
    </div>

    <div id="pantalla-hechiceros" class="pantalla">
        <h2 style="color:#a333ff; margin-bottom:20px;">EXPANSIÓN DE DOMINIO</h2>
        <div id="contenedor-hechiceros"></div>
        <br>
        <div class="btn-menu zona-interactiva" onclick="cambiarPantalla('menu')">VOLVER</div>
    </div>

    <div id="menu-pausa">
        <h2>JUEGO EN PAUSA</h2>
        <br>
        <div class="contenedor-botones zona-interactiva">
            <div class="btn-menu" onclick="activarPausa(false)">REANUDAR</div>
            <div class="btn-menu" style="color:#ff3c3c;" onclick="volverAlMenuPrincipal()">SALIR</div>
        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
