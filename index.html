<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Cat: Jujutsu Chronicles</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .interfaz-html { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: white; }
        
        /* Estilos Tienda y Buscador */
        .caja-desplazable { width: 320px; max-height: 55%; overflow-y: auto; background: rgba(5, 5, 10, 0.95); border: 1px solid #00ff82; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .item-tienda { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 8px; border-bottom: 1px solid #222; font-size: 11px; }
        .btn-comprar { background: #00ff82; border: none; color: black; font-weight: bold; padding: 4px 8px; cursor: pointer; }
        .btn-comprar:disabled { background: #444; color: #888; }
        
        .btn-menu-cons { padding: 10px; background: rgba(0,255,130,0.1); border: 1px solid #00ff82; color: #00ff82; font-weight: bold; text-align: center; cursor: pointer; width: 100%; }
        .item-habilidad { width: 260px; padding: 12px; background: rgba(163, 51, 255, 0.1); border: 1px solid #a333ff; color: white; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <canvas id="canvasJuego"></canvas>

    <div id="hud-juego" style="position:absolute; top:15px; left:20px; display:none; color:white; z-index:20;">
        ENERGÍA: 30/30
    </div>

    <div id="pantalla-hechiceros" class="interfaz-html">
        <h2 style="color:#a333ff; margin-bottom:20px;">SELECCIÓN DE HECHICEROS</h2>
        <div id="contenedor-hechiceros"></div>
    </div>

    <div id="pantalla-tienda" class="interfaz-html">
        <h2 style="color:#00ff82; margin-bottom:5px;">TIENDA DE MEJORAS</h2>
        <div style="font-size:12px; margin-bottom:15px;">Tu Saldo: <span id="txt-saldo-tienda" style="color:#00ff82; font-weight:bold;">0</span> PTS</div>
        <div id="contenedor-tienda" class="caja-desplazable"></div>
        <br>
        <button class="btn-comprar" style="width:320px; height:35px;" onclick="cambiarPantalla('menu')">VOLVER AL MENÚ</button>
    </div>

    <div id="pantalla-construccion-raiz" class="interfaz-html">
        <h2 style="color:#00ff82; margin-bottom:20px;">CENTRAL DE CONSTRUCCIÓN</h2>
        
        <div style="width:320px; display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn-menu-cons" onclick="accionarLupa()">🔍 LUPA</button>
            <button class="btn-menu-cons" onclick="mostrarRecientes()">⏳ RECIENTE</button>
        </div>

        <div style="width:320px; margin-bottom:15px;">
            <button class="btn-menu-cons" style="background:#00ff82; color:black; font-size:16px;" onclick="cambiarPantalla('editor_nuevo')">🛠️ NEW (CREAR)</button>
        </div>

        <div style="font-size:11px; color:#aaa; margin-bottom:5px; width:320px; text-align:left;">PROYECTOS ENCONTRADOS:</div>
        <div id="lista-proyectos" class="caja-desplazable" style="height:180px;"></div>
        
        <br>
        <button class="btn-comprar" style="width:320px; height:35px;" onclick="cambiarPantalla('menu')">VOLVER AL MENÚ</button>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
