<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Cat Mod Center</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; font-family: monospace; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .interfaz-html { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: white; }
        .caja-desplazable { width: 310px; max-height: 45%; overflow-y: auto; background: rgba(5, 5, 10, 0.95); border: 1px solid #00ff82; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .btn-menu-cons { padding: 10px; background: rgba(0,255,130,0.1); border: 1px solid #00ff82; color: #00ff82; font-weight: bold; width: 100%; cursor: pointer; }
        .item-tienda { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 6px; font-size: 11px; }
        .btn-comprar { background: #00ff82; border: none; color: black; font-weight: bold; padding: 3px 6px; }
        .overlay-pausa { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .item-habilidad { padding: 10px; background: rgba(163,51,255,0.2); border: 1px solid #a333ff; width: 200px; text-align: center; margin-bottom: 8px; }
    </style>
</head>
<body>

    <canvas id="canvasJuego"></canvas>
    <div id="hud-juego" style="position:absolute; top:15px; left:20px; display:none; color:white; z-index:20;">ENERGÍA ACTIVA</div>

    <div id="pantalla-hechiceros" class="interfaz-html">
        <h2>SKINS DISPONIBLES</h2><br>
        <div id="contenedor-hechiceros"></div>
    </div>

    <div id="pantalla-tienda" class="interfaz-html">
        <h2>TIENDA DE MEJORAS</h2><br>
        <div id="contenedor-tienda" class="caja-desplazable"></div><br>
        <button class="btn-comprar" style="width:310px; height:30px;" onclick="cambiarPantalla('menu')">VOLVER</button>
    </div>

    <div id="pantalla-construccion-raiz" class="interfaz-html">
        <h2>MODO CONSTRUCCIÓN</h2><br>
        <div style="width:310px; display:flex; gap:8px; margin-bottom:10px;">
            <button class="btn-menu-cons" onclick="accionarLupa()">🔍 LUPA</button>
            <button class="btn-menu-cons" onclick="mostrarRecientes()">⏳ RECIENTE</button>
        </div>
        <button class="btn-menu-cons" style="background:#00ff82; color:black; margin-bottom:10px;" onclick="cambiarPantalla('abrir_selector_tipo')">🛠️ NEW (CREAR)</button>
        <div id="lista-proyectos" class="caja-desplazable"></div><br>
        <button class="btn-comprar" style="width:310px; height:30px;" onclick="cambiarPantalla('menu')">VOLVER</button>
    </div>

    <div id="pantalla-selector-tipo-construccion" class="interfaz-html">
        <h2>ELIGE TIPO DE SUB-JUEGO</h2><br>
        <button class="btn-menu-cons" style="width:280px; margin-bottom:8px;" onclick="iniciarNuevoProyectoFlujo('dance')">🔥 DANCE OF FIRE AND ICE</button>
        <button class="btn-menu-cons" style="width:280px; margin-bottom:8px;" onclick="iniciarNuevoProyectoFlujo('shoot')">📦 SHOOT THE BOX</button>
        <button class="btn-menu-cons" style="width:280px; margin-bottom:15px;" onclick="iniciarNuevoProyectoFlujo('normal')">⚔️ MODO NORMAL</button>
        <button class="btn-comprar" style="width:280px; height:30px; background:#ff3c3c; color:white;" onclick="cambiarPantalla('menu_construccion')">CANCELAR</button>
    </div>

    <div id="editor-pausa-overlay" class="overlay-pausa">
        <h2>EDICIÓN PAUSADA</h2><br>
        <button class="btn-menu-cons" style="width:220px; background:#00ff82; color:black; margin-bottom:10px;" onclick="cerrarOverlayPausaEditor()">SEGUIR</button>
        <button class="btn-menu-cons" style="width:220px; background:#ff3c3c; color:white;" onclick="guardarYSalirEditorTotal()">SAVE Y EXIT</button>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
