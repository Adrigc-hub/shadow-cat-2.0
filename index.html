<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Cat: Jujutsu Chronicles</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .interfaz-html {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #hud-juego {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            color: #fff;
            font-size: 14px;
        }
        .btn-pausa {
            background: #ff3c3c;
            border: none;
            color: white;
            padding: 5px 12px;
            font-weight: bold;
        }
        #menu-pausa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 5, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            color: white;
        }
        #contenedor-hechiceros {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
        }
        .item-habilidad {
            width: 260px;
            padding: 12px;
            background: rgba(163, 51, 255, 0.1);
            border: 1px solid #a333ff;
            color: white;
            text-align: center;
            font-weight: bold;
        }
        .btn-retroceso {
            width: 260px;
            padding: 10px;
            background: transparent;
            border: 1px solid #00ff82;
            color: #00ff82;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="canvasJuego"></canvas>

    <div id="hud-juego">
        <div>ENERGÍA: <span id="txt-vida">30</span> / 30</div>
        <button class="btn-pausa" onclick="activarPausa(true)">PAUSA</button>
    </div>

    <div id="pantalla-hechiceros" class="interfaz-html">
        <h2 style="color:#a333ff; margin-bottom:30px;">SELECCIÓN DE HECHICEROS</h2>
        <div id="contenedor-hechiceros"></div>
        <br><br>
        <div class="btn-retroceso" onclick="cambiarPantalla('menu')">VOLVER AL MENÚ</div>
    </div>

    <div id="menu-pausa">
        <h2>JUEGO EN PAUSA</h2>
        <br><br>
        <div class="btn-retroceso" style="border-color:#ff3c3c; color:#ff3c3c;" onclick="volverAlMenuPrincipal()">ABANDONAR PARTIDA</div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
