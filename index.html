<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jujutsu Kaisen: Expansión Cósmica Realista</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020208;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #interfaz-usuario {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .panel-menu {
            background: rgba(4, 4, 12, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            color: white;
            pointer-events: auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255,255,255,0.05);
            max-width: 420px;
            margin: auto;
            text-align: center;
        }
        .fila-botones {
            display: flex;
            gap: 12px;
            margin: 15px 0;
        }
        .btn-personalizado {
            flex: 1;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .btn-personalizado:active {
            transform: scale(0.94);
        }
        .grid-tienda {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
            padding-right: 4px;
            margin-top: 10px;
        }
        .item-tienda {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            text-align: left;
        }
        .item-tienda button {
            width: 100%;
            background: rgba(255,255,255,0.12);
            color: white;
            border: none;
            padding: 5px;
            margin-top: 5px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Botón de Pausa en Partida */
        #btn-pausa {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            font-weight: bold;
            z-index: 100;
            display: none;
            pointer-events: auto;
            cursor: pointer;
        }
        /* Menú de Pausa Flotante */
        #menu-pausa {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            background: rgba(3, 3, 10, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            color: white;
            text-align: center;
            display: none;
            pointer-events: auto;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            width: 280px;
        }
    </style>
</head>
<body>

    <button id="btn-pausa" onclick="pausarJuego()">⏸ PAUSA</button>

    <div id="menu-pausa">
        <h2 style="margin-top: 0; letter-spacing: 2px; color: #ffaa00;">JUEGO PAUSADO</h2>
        <p style="font-size: 13px; color: #aaa; margin-bottom: 25px;">Progreso retenido en el cosmos.</p>
        <button class="btn-personalizado" style="background: #00ffcc; color: #000; width: 100%; margin-bottom: 12px;" onclick="reanudarJuego()">REANUDAR</button>
        <button class="btn-personalizado" style="background: #ff3333; color: #fff; width: 100%;" onclick="volverAlMenuPrincipal()">REGRESAR AL MENU</button>
    </div>

    <div id="interfaz-usuario">
        <div id="contenedor-menu" class="panel-menu">
            <h1 style="margin: 0; font-size: 24px; letter-spacing: 4px; text-shadow: 0 0 15px rgba(255,255,255,0.2);">JUJUTSU EVOLUTION</h1>
            <p style="margin: 5px 0 20px 0; font-size: 11px; color: #666; text-transform: uppercase;">Renderizado Realista & Físicas Avanzadas</p>
            
            <div class="fila-botones">
                <button class="btn-personalizado" style="background: #00ffcc; color: #000;" onclick="activarModoJuego('ritmo')">Dance of Fire</button>
                <button class="btn-personalizado" style="background: #ffaa00; color: #000;" onclick="activarModoJuego('disparos')">Shoot the Box</button>
            </div>
            
            <button class="btn-personalizado" style="background: linear-gradient(45deg, #7a1fd1, #a333ff); color: #fff; width: 100%; margin-bottom: 15px;" onclick="activarModoJuego('campaña')">⚔ MODO CAMPAÑA</button>

            <h3 style="margin: 15px 0 5px 0; text-align: left; font-size: 14px; color: #bbb; border-bottom: 1px solid #222; padding-bottom: 4px;">Tienda de Habilidades</h3>
            <div id="box-tienda" class="grid-tienda"></div>
        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
