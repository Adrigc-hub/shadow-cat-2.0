<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHADOW CAT: JJK ARENA</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b12;
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Contenedor General */
        .pantalla {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 20px;
            z-index: 5;
        }
        .activa {
            display: flex;
        }
        
        .titulo-principal {
            font-size: 26px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-align: center;
            font-weight: bold;
        }
        .subtitulo {
            font-size: 11px;
            color: #a333ff;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .marcador-puntos {
            font-size: 15px;
            color: #ffcc00;
            margin-bottom: 35px;
            font-weight: bold;
        }
        /* Botones de tu Menú */
        .btn-menu {
            width: 85%;
            max-width: 280px;
            padding: 15px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s ease;
        }
        .btn-menu:active {
            transform: scale(0.95);
        }
        .btn-azul { background-color: #007bef; }
        .btn-rosa { background-color: #e60067; }
        .btn-morado { background-color: #9000c7; }

        /* Tienda de Habilidades */
        .lista-tienda {
            width: 90%;
            max-width: 320px;
            max-height: 220px;
            overflow-y: auto;
            background: #12121f;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .item-habilidad {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #1c1c2e;
        }
        .info-txt {
            text-align: left;
        }
        .btn-comprar {
            background: #ffcc00;
            color: black;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-comprar.adquirido {
            background: #00ff66;
            color: black;
        }
        
        /* El fondo interactivo del juego */
        #canvasFondo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #05050a;
        }
    </style>
</head>
<body>

    <audio id="musica-gd" loop>
        <source src="https://audio.jofre.de/stayinsideme.mp3" type="audio/mp3">
    </audio>

    <canvas id="canvasFondo"></canvas>

    <div id="pantalla-menu" class="pantalla activa">
        <h1 class="titulo-principal">SHADOW CAT: JJK ARENA</h1>
        <div class="subtitulo">Físicas Anti-Fantasmas y Hitbox de Precisión</div>
        <div class="marcador-puntos">Puntos Acumulados: <span id="txt-puntos">100</span> PTS</div>
        
        <button class="btn-menu btn-azul" onclick="cambiarA('juego')">Entrar a Combate</button>
        <button class="btn-menu btn-rosa" onclick="cambiarA('hechiceros')">Hechiceros (13 Skins)</button>
        <button class="btn-menu btn-morado" onclick="cambiarA('tienda')">10 Habilidades Comprables</button>
    </div>

    <div id="pantalla-hechiceros" class="pantalla">
        <h2>SELECCIÓN DE HECHICEROS</h2>
        <div class="lista-tienda" id="contenedor-hechiceros">
            </div>
        <button class="btn-menu btn-rosa" onclick="cambiarA('menu')">Volver al Menú</button>
    </div>

    <div id="pantalla-tienda" class="pantalla">
        <h2>HABILIDADES COMPRABLES</h2>
        <div class="lista-tienda" id="contenedor-tienda">
            </div>
        <button class="btn-menu btn-morado" onclick="cambiarA('menu')">Volver al Menú</button>
    </div>

    <div id="pantalla-juego" class="pantalla">
        <h2 style="color:#ffcc00;">¡EN COMBATE!</h2>
        <p>Tu partida se está ejecutando en la arena...</p>
        <button class="btn-menu btn-rosa" onclick="cambiarA('menu')">Salir al Menú</button>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
