<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Cat: Jujutsu Chronicles</title>
    <style>
        /* --- ESTILOS GENERALES Y RESETS --- */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Canvas principal siempre de fondo */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- CAPAS DE INTERFAZ SOBRE EL CANVAS --- */
        .pantalla {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none; /* Deja ver el canvas de fondo */
        }
        .pantalla.activa {
            display: flex;
        }

        /* Botones y elementos cliqueables deben reaccionar al touch */
        .zona-interactiva {
            pointer-events: auto;
        }

        /* --- MENÚ PRINCIPAL --- */
        .titulo-juego {
            font-size: 28px;
            color: #ff3c3c;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 60, 60, 0.6);
            margin-bottom: 160px; /* Espacio para que se vea el gato en la banca */
            text-align: center;
        }

        .contenedor-botones {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .btn-menu {
            width: 260px;
            height: 45px;
            background: rgba(0, 255, 130, 0.05);
            border: 2px solid transparent; /* La animación del canvas dibuja el borde neón */
            color: #00ff82;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-menu:active {
            background: rgba(0, 255, 130, 0.2);
        }

        /* --- HUD EN PARTIDA --- */
        #hud-juego {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            color: #fff;
            font-size: 16px;
        }
        .btn-pausa {
            background: #ff3c3c;
            border: none;
            color: white;
            padding: 5px 12px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
        }

        /* --- MENÚ DE PAUSA --- */
        #menu-pausa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 2, 5, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            color: white;
        }

        /* --- TIENDA DE HECHICEROS (SKINS) --- */
        .tienda-titulo {
            color: #a333ff;
            font-size: 24px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(163, 51, 255, 0.5);
        }
        #contenedor-hechiceros {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 50%;
            overflow-y: auto;
            pointer-events: auto;
            padding: 10px;
        }
        .item-habilidad {
            width: 260px;
            padding: 12px;
            background: rgba(163, 51, 255, 0.1);
            border: 1px solid #a333ff;
            color: white;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
        }
        .item-habilidad:active {
            background: rgba(163, 51, 255, 0.3);
        }
    </style>
</head>
<body>

    <canvas id="canvasJuego"></canvas>

    <div id="hud-juego">
        <div>Puntos Totales: <span id="txt-puntos">0</span></div>
        <button class="btn-pausa" onclick="activarPausa(true)">PAUSA</button>
    </div>

    <div id="pantalla-menu" class="pantalla activa">
        <div class="titulo-juego">SHADOW CAT:<br>JUJUTSU CHRONICLES</div>
        <div class="contenedor-botones zona-interactiva">
            <div class="btn-menu" onclick="cambiarPantalla('juego-original')">MODO ORIGINAL</div>
            <div class="btn-menu" onclick="cambiarPantalla('juego-ritmo')">DANCE OF FIRE</div>
            <div class="btn-menu" onclick="cambiarPantalla('juego-shoot')">SHOOT THE BOX</div>
            <div class="btn-menu" onclick="cambiarPantalla('hechiceros')">HECHICEROS (SKINS)</div>
        </div>
    </div>

    <div id="pantalla-hechiceros" class="pantalla">
        <div class="tienda-titulo">EXPANSIÓN DE DOMINIO</div>
        <div id="contenedor-hechiceros"></div>
        <br>
        <div class="btn-menu zona-interactiva" style="border: 1px solid #00ff82;" onclick="cambiarPantalla('menu')">VOLVER</div>
    </div>

    <div id="menu-pausa">
        <h2>JUEGO PAUSADO</h2>
        <br><br>
        <div class="contenedor-botones zona-interactiva">
            <div class="btn-menu" style="color:#00ff82;" onclick="activarPausa(false)">RESUMIR</div>
            <div class="btn-menu" style="color:#ff3c3c;" onclick="volverAlMenuPrincipal()">SALIR AL MENÚ</div>
        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
