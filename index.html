<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jujutsu Kaisen: Expansión de Dominio Cósmico</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #03030c;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        /* La interfaz HTML flotará de forma limpia sobre el renderizado del motor */
        #interfaz-usuario {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Permite que los toques pasen al lienzo cuando no hay menús */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .panel-menu {
            background: rgba(5, 5, 15, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            color: white;
            pointer-events: auto; /* Activa los clicks e interacciones solo en este cuadro */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            max-width: 420px;
            margin: auto;
            text-align: center;
        }
        .fila-botones {
            display: flex;
            gap: 12px;
            margin: 15px 0;
        }
        .btn-personalizado {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-personalizado:active {
            transform: scale(0.92);
        }
        .grid-tienda {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
            padding-right: 4px;
            margin-top: 10px;
        }
        .item-tienda {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px;
            font-size: 11px;
            text-align: left;
        }
        .item-tienda button {
            width: 100%;
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            padding: 4px;
            margin-top: 5px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #btn-regresar {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            background: rgba(255, 50, 50, 0.8);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            z-index: 100;
            display: none;
            pointer-events: auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button id="btn-regresar" onclick="volverAlMenuPrincipal()">⬅ SALIR AL MENÚ</button>

    <div id="interfaz-usuario">
        <div id="contenedor-menu" class="panel-menu">
            <h1 style="margin: 0; font-size: 26px; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3);">JUJUTSU EXPANSION</h1>
            <p style="margin: 5px 0 20px 0; font-size: 12px; color: #888;">Físicas Corregidas & Motor Gráfico de Alta Fluidez</p>
            
            <div class="fila-botones">
                <button class="btn-personalizado" style="background: #00ffcc; color: #000;" onclick="activarModoJuego('ritmo')">Dance of Fire</button>
                <button class="btn-personalizado" style="background: #ffaa00; color: #000;" onclick="activarModoJuego('disparos')">Shoot the Box</button>
            </div>
            
            <button class="btn-personalizado" style="background: #a333ff; color: #fff; width: 100%; margin-bottom: 15px;" onclick="activarModoJuego('campaña')">⚔ MODO CAMPAÑA</button>

            <h3 style="margin: 15px 0 5px 0; text-align: left; font-size: 15px; color: #ddd; border-bottom: 1px solid #333; padding-bottom: 4px;">Tienda de Habilidades (15)</h3>
            <div id="box-tienda" class="grid-tienda">
                </div>
        </div>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
