<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Cat: Jujutsu Kaisen 2.0</title>
    <!-- Cargamos p5.js desde CDN para que funcione en GitHub de forma nativa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 0 30px rgba(130, 50, 200, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<script>
/* --- Shadow Cat: Edición Jujutsu Kaisen 2.0 (Change of Scene & Sukuna Boss) --- */
let ancho = 360, alto = 640;

// Sistema de Audio Web Pro (Audio Puro & Polifónico sin p5.sound)
let audioCtx;

// --- DICCIONARIO DE FRECUENCIAS ---
let NOTAS = {
    'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
    'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
    'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'A5': 880.00, 'A#5': 932.33, 'B5': 987.77,
    'C6': 1046.50, 'C#6': 1109.73, 'D6': 1174.66, 'E6': 1318.51
};

let encodingSweetly = ['E5', 'G5', 'C6', 'G5', 'E5', 'G5', 'C6', 'G5', 'D5', 'F5', 'B5', 'F5'];
let encodingGDChangeOfScene = [
    'A3', 'E4', 'A4', 'C5', 'E4', 'A4', 'C5', 'E4', 'A4', 'C5', 'E4', 'A4',
    'G3', 'E4', 'G4', 'B4', 'E4', 'G4', 'B4', 'E4', 'G4', 'B4', 'E4', 'G4',
    'F3', 'C4', 'F4', 'A4', 'C4', 'F4', 'A4', 'C4', 'F4', 'A4', 'C4', 'F4',
    'E3', 'B3', 'E4', 'G#4', 'B3', 'E4', 'G#4', 'B3', 'E4', 'G#4', 'B3', 'E4',
    'A4', 'C5', 'E5', 'A5', 'E5', 'C5', 'B4', 'D5', 'F5', 'B5', 'F5', 'D5'
];
let indiceNotaMusica = 0;

function iniciarAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function reproducirMusica() {
    if (!audioCtx || estadoPantalla !== 'juego' || !juegoVivo || ejecutandoAnimacion || ejecutandoAnimacionMuerteFuria) return;
    let tiempoActual = audioCtx.currentTime;
    
    if (!faseLastBreath) {
        if (frameCount % 14 === 0) { 
            let nota = encodingSweetly[indiceNotaMusica % encodingSweetly.length];
            let frec = NOTAS[nota] || 440;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(frec, tiempoActual);
            gain.gain.setValueAtTime(0.0, tiempoActual);
            gain.gain.linearRampToValueAtTime(0.2, tiempoActual + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, tiempoActual + 0.4);
            osc.start(tiempoActual); osc.stop(tiempoActual + 0.43);
            indiceNotaMusica++;
        }
    } else {
        let rate = modoFuriaActivo ? 5 : 7; 
        if (frameCount % rate === 0) {
            let nota = encodingGDChangeOfScene[indiceNotaMusica % encodingGDChangeOfScene.length];
            let frec = NOTAS[nota] || 440;
            let osc1 = audioCtx.createOscillator();
            let osc2 = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            osc1.connect(gainNode); osc2.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc1.type = 'triangle'; osc2.type = 'sawtooth';
            osc1.frequency.setValueAtTime(frec, tiempoActual);
            osc2.frequency.setValueAtTime(frec * 0.5, tiempoActual);
            
            gainNode.gain.setValueAtTime(0.0, tiempoActual);
            gainNode.gain.linearRampToValueAtTime(0.15, tiempoActual + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, tiempoActual + 0.28);
            
            osc1.start(tiempoActual); osc2.start(tiempoActual);
            osc1.stop(tiempoActual + 0.3); osc2.stop(tiempoActual + 0.3);
            indiceNotaMusica++;
        }
    }
}

function sonarSFX(tipo) {
    try {
        iniciarAudio(); if (!audioCtx) return;
        let tiempoActual = audioCtx.currentTime;
        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);

        if (tipo === 'vencerJefe') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, tiempoActual);
            gainNode.gain.setValueAtTime(0.2, tiempoActual);
            gainNode.gain.exponentialRampToValueAtTime(0.001, tiempoActual + 0.6);
            osc.start(tiempoActual); osc.stop(tiempoActual + 0.65);
        } else if (tipo === 'purpura' || tipo === 'trueno' || tipo === 'fuego') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(120, tiempoActual);
            osc.frequency.linearRampToValueAtTime(850, tiempoActual + 0.3);
            gainNode.gain.setValueAtTime(0.3, tiempoActual);
            gainNode.gain.linearRampToValueAtTime(0.001, tiempoActual + 0.35);
            osc.start(tiempoActual); osc.stop(tiempoActual + 0.36);
        } else if (tipo === 'corte' || tipo === 'sombras') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, tiempoActual);
            osc.frequency.exponentialRampToValueAtTime(100, tiempoActual + 0.08);
            gainNode.gain.setValueAtTime(0.2, tiempoActual);
            gainNode.gain.linearRampToValueAtTime(0.001, tiempoActual + 0.1);
            osc.start(tiempoActual); osc.stop(tiempoActual + 0.11);
        } else if (tipo === 'laser' || tipo === 'fuga') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(650, tiempoActual);
            osc.frequency.exponentialRampToValueAtTime(200, tiempoActual + 0.2);
            gainNode.gain.setValueAtTime(0.2, tiempoActual);
            osc.start(tiempoActual); osc.stop(tiempoActual + 0.22);
        } else if (tipo === 'daño') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(120, tiempoActual);
            gainNode.gain.setValueAtTime(0.3, tiempoActual);
            gainNode.gain.linearRampToValueAtTime(0.001, tiempoActual + 0.12);
            osc.start(tiempoActual); osc.stop(tiempoActual + 0.13);
        } else if (tipo === 'salto') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(260, tiempoActual);
            osc.frequency.exponentialRampToValueAtTime(480, tiempoActual + 0.12);
            gainNode.gain.setValueAtTime(0.1, tiempoActual);
            osc.start(tiempoActual); osc.stop(tiempoActual + 0.13);
        } else if (tipo === 'gameover') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, tiempoActual);
            osc.frequency.linearRampToValueAtTime(60, tiempoActual + 0.4);
            gainNode.gain.setValueAtTime(0.3, tiempoActual);
            gainNode.gain.linearRampToValueAtTime(0.001, tiempoActual + 0.45);
            osc.start(tiempoActual); osc.stop(tiempoActual + 0.46);
        } else {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, tiempoActual);
            gainNode.gain.setValueAtTime(0.04, tiempoActual);
            osc.start(tiempoActual); osc.stop(tiempoActual + 0.05);
        }
    } catch(e) {}
}

// --- MAQUINARIA DE ESTADOS GENERALES ---
let estadoPantalla = 'menu'; 
let puntosTotalesBanco = 150; 
let skinSeleccionada = 'gojo'; 

let tieneEscudo1_Disponible = false; 
let tieneEscudo2_Disponible = false; 
let tieneAimbot_Disponible = false;  

// --- VARIABLES ENTORNO DE JUEGO BASE ---
let gatoX, gatoY = 480, gatoRadio = 22;
let colasAngulo = 0, gatoVelX = 0;   
let pistolaTimer = 0, pistolaAngulo = 0;
let rafagaPendiente = 0, rafagaTimer = 0;
let objetivoAsignado = null; 
let balas = [], objetivos = [], misilesPropios = [], chispas = [], particulasAmbiente = [];
let puntos = 0, balasEsquivadasContador = 0, balasEsquivadasTotal = 0; 
let juegoVivo = true, puntosGlobalesTotal = 0, temporizadorJefe = 0, jefe = null; 
let escudoActivo = false, tiempoEscudoRestante = 0;

// --- CONTROLADOR DE LA CINEMÁTICA ANIME ---
let ejecutandoAnimacion = false, animacionFrame = 0;
let cinemanticaMahoX = 180, cinemanticaMahoY = -50;
let azulX = 180, azulY = 240, rojoX = 180, rojoY = 500;
let explosionRadio = 0;

// --- INTERFAZ: REY DE LAS MALDICIONES (SUKUNA) ---
let faseLastBreath = false;
let bossHP = 100, gatoHP = 30, gatoHPMax = 30;  
let bossX, bossY = 120;
let cajaX = 80, cajaY = 320, cajaW = 200, cajaH = 200;
let ataqueTimer = 0, turnoJefe = true; 
let bossMensaje = "", bossMensajeTimer = 0, jefeFaseActual = 1; 
let usarGravedad = false, gatoVy = 0;
let gravedadPoder = 0.43, saltoFuerzaMax = -7.8, botonPresionadoTiempo = 0;
let blastersLista = [], blasterAnchoLaser = 55, frenesiAngular = 0; 
let UT_barraX = 60, UT_barraY = 230, UT_barraW = 240, UT_barraH = 40;
let UT_lineaX = 60, UT_lineaVel = 6.0;
let UT_ataqueDetenido = false, UT_resultadoTexto = "", UT_resultadoTimer = 0;
let modoFuriaActivo = false, yaAlcanzoMitadVida = false; 
let ejecutandoAnimacionMuerteFuria = false, animMuerteTimer = 0;

// --- NUEVA VARIABLE DE ENTORNO OPTIMIZADA PARA RESPIRACIÓN ---
let cicloRespiracion = 0;

function setup() {
    createCanvas(ancho, alto);
    gatoX = ancho / 2;
    // Generar partículas de fondo estables para optimizar procesamiento
    for (let i = 0; i < 20; i++) {
        particulasAmbiente.push({ x: random(ancho), y: random(alto), v: random(0.5, 1.5), s: random(1, 3) });
    }
}

function draw() {
    cicloRespiracion += 0.08; // Control centralizado del ciclo idle para todas las skins
    if (estadoPantalla === 'menu') dibujarMenuPrincipal();
    else if (estadoPantalla === 'tienda') dibujarTiendaMejoras();
    else if (estadoPantalla === 'skins') dibujarSelectorSkins();
    else if (estadoPantalla === 'juego') ejecutarLogicaJuego();
}

// --- MENÚS ---
function dibujarMenuPrincipal() {
    background(10, 10, 20);
    dibujarEfectoFondo();
    fill(255); textAlign(CENTER); textStyle(BOLD); textSize(28); text("SHADOW CAT", ancho / 2, 120);
    textSize(14); fill(180, 0, 255); text("Jujutsu & Change of Scene", ancho / 2, 145);
    fill(255, 215, 0); textSize(14); text("Puntos Totales: " + puntosTotalesBanco, ancho / 2, 200);
    dibujarBotonMenu(60, 260, 240, 50, "JUGAR", color(0, 150, 255));
    dibujarBotonMenu(60, 330, 240, 50, "TIENDA DE MEJORAS", color(130, 50, 200));
    dibujarBotonMenu(60, 400, 240, 50, "SELECCIÓN DE SKINS", color(220, 30, 100));
}

function dibujarTiendaMejoras() {
    background(15, 10, 25);
    fill(255); textAlign(CENTER); textStyle(BOLD); textSize(22); text("TIENDA DE MEJORAS", ancho / 2, 70);
    fill(255, 215, 0); textSize(14); text("Tu Saldo: " + puntosTotalesBanco + " PTS", ancho / 2, 100);
    dibujarTarjetaTienda(30, 140, 300, 80, "Escudo Temporal (Activable)", "Permite usar un escudo de 5s en partida.", 15, tieneEscudo1_Disponible);
    dibujarTarjetaTienda(30, 240, 300, 80, "Escudo Automático (Pasiva)", "Genera un escudo cada 10 balas.", 30, tieneEscudo2_Disponible);
    dibujarTarjetaTienda(30, 340, 300, 80, "Auto-Aim Legendario", "Impacto garantizado sin apuntar.", 1000000, tieneAimbot_Disponible);
    dibujarBotonMenu(60, 540, 240, 45, "VOLVER AL MENÚ", color(60, 60, 70));
}

function dibujarSelectorSkins() {
    background(10, 15, 25);
    fill(255); textAlign(CENTER); textStyle(BOLD); textSize(20); text("SELECCIÓN DE SKINS JJK", ancho / 2, 45);
    
    // Contenedor scrolleable simulado dinámicamente mediante posiciones fijas optimizadas
    dibujarOpcionSkin(40, 75, 'normal', "Gato Base", "Disparos de plasma dorado.");
    dibujarOpcionSkin(40, 140, 'gojo', "Gato Gojo Satoru", "Combo Destello PÚRPURA.");
    dibujarOpcionSkin(40, 205, 'yuji', "Gato Yuji Itadori", "Cortes rápidos DESMANTELAR.");
    dibujarOpcionSkin(40, 270, 'megumi', "Gato Megumi Fushiguro", "Ataque Sombras: Quimera.");
    dibujarOpcionSkin(40, 335, 'nobara', "Gato Nobara Kugisaki", "Resonancia: Daño crítico seguro.");
    dibujarOpcionSkin(40, 400, 'nanami', "Gato Kento Nanami", "Ratio 7:3: Multiplica el daño por ráfaga.");
    dibujarOpcionSkin(40, 465, 'maki', "Gato Maki Zen'in", "Fuerza Celestial: Balas perforantes.");
    dibujarOpcionSkin(40, 530, 'toji', "Gato Toji Fushiguro", "Frenesí Físico: Velocidad evasiva x1.2.");

    dibujarBotonMenu(60, 600, 240, 32, "VOLVER AL MENÚ", color(60, 60, 70));
}

function dibujarBotonMenu(x, y, w, h, texto, col) {
    fill(col); noStroke(); rect(x, y, w, h, 10);
    fill(255); textAlign(CENTER, CENTER); textSize(12); textStyle(BOLD); text(texto, x + w / 2, y + h / 2);
}

function dibujarTarjetaTienda(x, y, w, h, titulo, desc, costo, comprado) {
    fill(30, 25, 45); stroke(60, 50, 90); rect(x, y, w, h, 8);
    noStroke(); fill(255); textAlign(LEFT, TOP); textSize(12); textStyle(BOLD); text(titulo, x + 15, y + 12);
    fill(170); textStyle(NORMAL); textSize(10); text(desc, x + 15, y + 32, w - 110);
    textAlign(RIGHT, CENTER);
    if (comprado) { fill(0, 255, 120); textSize(11); textStyle(BOLD); text("ACTIVO", x + w - 15, y + h / 2); } 
    else { fill(puntosTotalesBanco >= costo ? color(255, 215, 0) : color(200, 50, 50)); textSize(11); textStyle(BOLD); text(costo >= 1000000 ? "1M PTS" : costo + " PTS", x + w - 15, y + h / 2); }
}

function dibujarOpcionSkin(x, y, idSkin, nombre, habilidad) {
    if (skinSeleccionada === idSkin) { fill(40, 35, 65); stroke(160, 0, 255); strokeWeight(2); } 
    else { fill(20, 20, 30); stroke(40); strokeWeight(1); }
    rect(x, y, ancho - 80, 60, 6);
    push(); translate(x + 35, y + 30); dibujarCuerpoGatoMiniatura(idSkin); pop();
    noStroke(); fill(255); textAlign(LEFT, TOP); textSize(12); textStyle(BOLD); text(nombre, x + 75, y + 12);
    fill(150); textStyle(NORMAL); textSize(9); text(habilityTruncate(habilidad), x + 75, y + 30, (ancho - 80) - 85);
}
function habilityTruncate(t) { return t; }

function dibujarCuerpoGatoMiniatura(idSkin) {
    let r = 9;
    let despY = sin(cicloRespiracion + (idSkin === skinSeleccionada ? 0 : 2)) * 0.8; 
    
    push();
    translate(0, despY);
    if (idSkin === 'gojo') {
        fill(255); triangle(-5, -12, -2, -12, -4, -18); triangle(5, -12, 2, -12, 4, -18);
        fill(30); ellipse(0, 0, r*2, r*1.4); fill(255); ellipse(0, -7, r*1.3, r*1.3);
        fill(0); stroke(255); strokeWeight(0.5); rect(-5, -9, 10, 3);
    } else if (idSkin === 'yuji') {
        fill(240, 120, 140); triangle(-5, -12, -2, -12, -4, -18); triangle(5, -12, 2, -12, 4, -18);
        fill(20); ellipse(0, 0, r*2, r*1.4); fill(240, 120, 140); ellipse(0, -7, r*1.2, r*1.2);
    } else if (idSkin === 'megumi') {
        fill(30, 40, 70); triangle(-5, -12, -2, -12, -4, -19); triangle(5, -12, 2, -12, 4, -19);
        fill(15); ellipse(0, 0, r*2, r*1.4); fill(25, 30, 50); ellipse(0, -7, r*1.2, r*1.2);
    } else if (idSkin === 'nobara') {
        fill(140, 80, 50); triangle(-5, -12, -2, -12, -4, -17); triangle(5, -12, 2, -12, 4, -17);
        fill(35, 20, 20); ellipse(0, 0, r*2, r*1.4); fill(150, 90, 60); ellipse(0, -7, r*1.2, r*1.2);
    } else if (idSkin === 'nanami') {
        fill(230, 210, 120); fill(40); ellipse(0, 0, r*2, r*1.4);
        fill(230, 210, 120); ellipse(0, -7, r*1.2, r*1.2);
        fill(180, 160, 50); rect(-4, -8, 8, 2);
    } else if (idSkin === 'maki') {
        fill(20, 50, 30); ellipse(0, 0, r*2, r*1.4); fill(25, 60, 40); ellipse(0, -7, r*1.2, r*1.2);
        stroke(200, 50, 50); noFill(); ellipse(0, -7, 6, 3);
    } else if (idSkin === 'toji') {
        fill(15); ellipse(0, 0, r*2, r*1.4); fill(35); ellipse(0, -7, r*1.2, r*1.2);
        stroke(100); line(-2, -5, 2, -5);
    } else {
        fill(12); ellipse(0, 0, r*2, r*1.5); ellipse(0, -10, r*1.3, r*1.3);
    }
    pop();
}

// --- AUXILIARES GRÁFICOS OPTIMIZADOS ---
function dibujarEfectoFondo() {
    noStroke();
    for (let p of particulasAmbiente) {
        p.y += p.v;
        if (p.y > alto) p.y = 0;
        fill(100, 80, 150, 40);
        ellipse(p.x, p.y, p.s, p.s);
    }
}

// --- NÚCLEO DE LÓGICA PRINCIPAL ---
function ejecutarLogicaJuego() {
    iniciarAudio();
    reproducirMusica();
    if (ejecutandoAnimacionMuerteFuria) { actualizarAnimacionMuerteFuria(); return; }
    if (ejecutandoAnimacion) { actualizarNuevaAnimacionAnime(); return; }
    if (faseLastBreath) { logicaCombateSukuna(); return; }

    background(12, 12, 20);
    dibujarEfectoFondo();

    if (juegoVivo) {
        let posXAnterior = gatoX;
        if (mouseIsPressed && mouseY < alto - 120) {
            let tocandoObjetivo = false;
            for (let o of objetivos) { if (dist(mouseX, mouseY, o.x, o.y) < (o.esJefe ? o.w/2 : o.r) + 30) tocandoObjetivo = true; }
            if (!tocandoObjetivo) {
                let modVel = (skinSeleccionada === 'toji') ? 0.35 : 0.25;
                gatoX = lerp(gatoX, mouseX, modVel);
            }
        }
        gatoX = constrain(gatoX, gatoRadio, ancho - gatoRadio);
        gatoVelX = gatoX - posXAnterior;

        if (escudoActivo) {
            if (--tiempoEscudoRestante <= 0) escudoActivo = false;
            noFill(); stroke(180, 0, 255, 220); strokeWeight(3); 
            ellipse(gatoX, gatoY - 10, gatoRadio * (2.8 + sin(cicloRespiracion)*0.1));
        }

        if (frameCount % 18 === 0) { balas.push({ x: random(20, ancho - 20), y: -10, vy: random(6, 9), tipo: "normal" }); }
        if (frameCount % 45 === 0 && random() < 0.6) objetivos.push({ x: random(30, ancho - 30), y: -20, vy: random(3, 5), r: 12, esJefe: false });

        temporizadorJefe++;
        if (temporizadorJefe >= 600 && temporizadorJefe < 690) {
            if (random() < 0.08 && !jefe) {
                jefe = { x: random(60, ancho - 60), y: -40, vy: 1.5, vidaMax: 20, vida: 20, w: 70, h: 70, esJefe: true };
                objetivos.push(jefe); temporizadorJefe = 0;
            }
        } else if (temporizadorJefe >= 690) { temporizadorJefe = 0; }

        if (rafagaPendiente > 0) {
            rafagaTimer--;
            if (rafagaTimer <= 0 && balasEsquivadasContador > 0) {
                let tProyectil = "estándar";
                if (skinSeleccionada === 'gojo') { tProyectil = "fusiónPurpura"; sonarSFX('purpura'); }
                else if (skinSeleccionada === 'yuji') { tProyectil = "desmantelar"; sonarSFX('corte'); }
                else if (skinSeleccionada === 'megumi') { tProyectil = "sombras"; sonarSFX('sombras'); }
                else if (skinSeleccionada === 'nobara') { tProyectil = "clavo"; sonarSFX('daño'); }
                else if (skinSeleccionada === 'nanami') { tProyectil = "ratio"; sonarSFX('corte'); }
                else if (skinSeleccionada === 'maki') { tProyectil = "lanza"; sonarSFX('corte'); }
                else if (skinSeleccionada === 'toji') { tProyectil = "nube"; sonarSFX('corte'); }
                
                misilesPropios.push({ x: gatoX, y: gatoY - 30, targetObj: objetivoAsignado, tipoProyectil: tProyectil, faseEfecto: 0 });
                balasEsquivadasContador--; rafagaPendiente--; rafagaTimer = 5; pistolaTimer = 5;
            } else if (balasEsquivadasContador <= 0) { rafagaPendiente = 0; }
        }

        // Renderizado & Colisión de Balas
        for (let i = balas.length - 1; i >= 0; i--) {
            balas[i].y += balas[i].vy; stroke(255, 50, 100); strokeWeight(2.5); line(balas[i].x, balas[i].y, balas[i].x, balas[i].y - 14);
            if (balas[i].y > alto + 20) {
                if (balas[i].y > gatoY + 20) {
                    balasEsquivadasContador++; balasEsquivadasTotal++;
                    if (tieneEscudo2_Disponible && balasEsquivadasTotal % 10 === 0) { escudoActivo = true; tiempoEscudoRestante = 600; }
                }
                balas.splice(i, 1); continue;
            }
            if (dist(balas[i].x, balas[i].y, gatoX, gatoY - 10) < gatoRadio + 5) {
                if (escudoActivo) { balas.splice(i, 1); continue; }
                juegoVivo = false; puntosTotalesBanco += puntos; sonarSFX('gameover');
            }
        }

        // Renderizado & Colisión de Maldiciones Enemigas
        for (let i = objetivos.length - 1; i >= 0; i--) {
            let o = objetivos[i]; o.y += o.vy;
            if (o.esJefe) {
                fill(200, 30, 40); stroke(255, 150, 150); rect(o.x, o.y, o.w, o.h, 8);
                if (dist(o.x, o.y, gatoX, gatoY - 10) < gatoRadio + o.w/2) { if (escudoActivo) { destruirJefe(i); continue; } juegoVivo = false; puntosTotalesBanco += puntos; sonarSFX('gameover'); }
            } else {
                fill(120, 30, 180); noStroke(); rect(o.x, o.y, o.r * 2, o.r * 2, 4);
                if (dist(o.x, o.y, gatoX, gatoY - 10) < gatoRadio + o.r) { if (escudoActivo) { objetivos.splice(i, 1); continue; } juegoVivo = false; puntosTotalesBanco += puntos; sonarSFX('gameover'); }
            }
            if (o.y > alto - 120) { if(o.esJefe) jefe = null; objetivos.splice(i, 1); }
        }

        // Renderizado & Colisión de Proyectiles Aliados
        for (let i = misilesPropios.length - 1; i >= 0; i--) {
            let m = misilesPropios[i]; m.faseEfecto += 0.1;
            let target = (tieneAimbot_Disponible && objetivos.length > 0) ? objetivos[0] : m.targetObj;
            if (objetivos.includes(target) && target) {
                let ang = atan2(target.y - m.y, target.x - m.x);
                m.x += cos(ang) * 14; m.y += sin(ang) * 14; pistolaAngulo = ang;
            } else { m.y -= 12; }

            if (m.y < -40 || m.y > alto + 40) { misilesPropios.splice(i, 1); continue; }

            // Diseños visuales avanzados por proyectil de Skin
            if (m.tipoProyectil === "fusiónPurpura") {
                let desv = sin(m.faseEfecto * 5) * 8;
                fill(0, 100, 255); ellipse(m.x - desv, m.y, 8, 8); fill(255, 0, 50); ellipse(m.x + desv, m.y, 8, 8);
                fill(180, 0, 255); ellipse(m.x, m.y, 16, 16);
            } else if (m.tipoProyectil === "desmantelar") {
                stroke(220, 240, 255); strokeWeight(3); line(m.x - 15, m.y - 5, m.x + 15, m.y + 5);
            } else if (m.tipoProyectil === "sombras") {
                fill(30); stroke(100, 0, 200); strokeWeight(1.5); ellipse(m.x, m.y, 14, 18);
            } else if (m.tipoProyectil === "clavo") {
                stroke(200); strokeWeight(4); line(m.x, m.y, m.x, m.y + 10); fill(255, 0, 0); ellipse(m.x, m.y, 6, 6);
            } else if (m.tipoProyectil === "ratio") {
                stroke(255, 215, 0); strokeWeight(4); line(m.x - 8, m.y, m.x + 8, m.y);
            } else if (m.tipoProyectil === "lanza") {
                stroke(50, 180, 100); strokeWeight(3); line(m.x, m.y - 5, m.x, m.y + 15);
            } else if (m.tipoProyectil === "nube") {
                stroke(240); strokeWeight(5); line(m.x - 6, m.y + 6, m.x + 6, m.y - 6);
            } else {
                stroke(255, 215, 0); strokeWeight(4); line(m.x, m.y, m.x, m.y + 12);
            }

            let breakM = false;
            for (let j = objetivos.length - 1; j >= 0; j--) {
                if (dist(m.x, m.y, objetivos[j].x, objetivos[j].y) < (objetivos[j].esJefe ? 40 : 20)) {
                    crearChispas(objetivos[j].x, objetivos[j].y);
                    let multDmg = (skinSeleccionada === 'nanami' && random() < 0.3) ? 3 : 1;
                    if (objetivos[j].esJefe) { 
                        objetivos[j].vida -= multDmg; 
                        if (objetivos[j].vida <= 0) destruirJefe(j); 
                    } else { 
                        objetivos.splice(j, 1); puntos += multDmg; 
                    }
                    if (skinSeleccionada !== 'maki') breakM = true; 
                    break;
                }
            }
            if (breakM) misilesPropios.splice(i, 1);
        }
        
        // Ejecución y degradado estable de chispas
        for (let i = chispas.length - 1; i >= 0; i--) {
            let c = chispas[i]; c.x += c.vx; c.y += c.vy; c.alfa -= 8;
            fill(c.color.r, c.color.g, c.color.b, c.alfa); noStroke(); ellipse(c.x, c.y, c.tam);
            if (c.alfa <= 0) chispas.splice(i, 1);
        }
    } else {
        fill(40, 10, 10, 160); rect(0, 0, ancho, alto - 120);
        fill(255, 60, 60); textAlign(CENTER, CENTER); textSize(24); text("¡HAZ CAÍDO!", ancho / 2, alto / 2 - 30);
    }

    renderizarDiseñoGatoEvolucionado();

    fill(255); textSize(14); textAlign(LEFT); text("Puntos: " + puntos, 20, 35);
    textSize(11); fill(180, 150, 230); text("Energía Maldita: " + puntosGlobalesTotal + " / 100", 20, 55);
    textAlign(RIGHT); fill(0, 255, 255); text("Munición: " + balasEsquivadasContador, ancho - 20, 35);
    fill(22, 22, 35); rect(0, alto - 100, ancho, 100);
    if (tieneEscudo1_Disponible) dibujarBoton(40, alto - 80, 280, 50, "ACTIVAR INFINITO / ESCUDO (5S)", 0, escudoActivo);
}

// --- RENDERIZACIÓN DE LAS SKINS CON FÍSICAS DE RESPIRACIÓN (IDLE ANIMATION) ---
function renderizarDiseñoGatoEvolucionado() {
    push(); 
    translate(gatoX, gatoY);
    
    // Modulador físico basado en onda senoidal matemática para simular respiración realista
    let factorRespiracion = sin(cicloRespiracion) * 0.9;
    scale(1, 1 + factorRespiracion * 0.04); 

    colasAngulo += 0.05; 
    let movCola = sin(colasAngulo) * 12;

    let cBase = color(15, 15, 25);
    let cPelo = color(15);

    if (skinSeleccionada === 'gojo') { cBase = color(25); cPelo = color(255); }
    else if (skinSeleccionada === 'yuji') { cBase = color(30, 20, 25); cPelo = color(240, 120, 140); }
    else if (skinSeleccionada === 'megumi') { cBase = color(15, 20, 35); cPelo = color(30, 40, 70); }
    else if (skinSeleccionada === 'nobara') { cBase = color(40, 25, 25); cPelo = color(130, 75, 45); }
    else if (skinSeleccionada === 'nanami') { cBase = color(50, 45, 30); cPelo = color(240, 220, 130); }
    else if (skinSeleccionada === 'maki') { cBase = color(20, 35, 25); cPelo = color(30, 75, 45); }
    else if (skinSeleccionada === 'toji') { cBase = color(10); cPelo = color(45); }

    // Orejas
    fill(cPelo); noStroke();
    triangle(-14, -22, -4, -24, -15, -34); triangle(14, -22, 3, -24, 15, -34);

    // Cola con física fluida
    stroke(cBase); strokeWeight(4); noFill();
    beginShape(); vertex(gatoRadio * 0.7, -2); bezierVertex(gatoRadio * 1.1, 8, gatoRadio * 1.5 + movCola, 22, gatoRadio * 1.2, 42); endShape();

    // Cuerpo y Cabeza
    fill(cBase); noStroke(); ellipse(0, 0, gatoRadio * 2, gatoRadio * 1.5);
    fill(cPelo); ellipse(0, -18, gatoRadio * 1.4, gatoRadio * 1.4); 

    // Ojos y Accesorios Personalizados por Personaje
    if (skinSeleccionada === 'gojo') {
        fill(10); stroke(240); strokeWeight(1); ellipse(-5, -17, 7, 7); ellipse(5, -17, 7, 7); line(-2, -17, 2, -17);
    } else if (skinSeleccionada === 'yuji') {
        fill(180, 40, 40); rect(-6, -3, 12, 5, 1); stroke(0); strokeWeight(1); line(-6, -14, -3, -15); line(6, -14, 3, -15);
    } else if (skinSeleccionada === 'megumi') {
        fill(10, 200, 150); ellipse(-5, -18, 4, 6); ellipse(5, -18, 4, 6);
    } else if (skinSeleccionada === 'nobara') {
        fill(200, 80, 40); ellipse(-5, -18, 4, 5); fill(30); rect(2, -21, 6, 6);
    } else if (skinSeleccionada === 'nanami') {
        fill(200, 180, 50); rect(-7, -20, 6, 4, 1); rect(1, -20, 6, 4, 1); stroke(50); line(-1, -18, 1, -18);
    } else if (skinSeleccionada === 'maki') {
        stroke(200, 40, 40); strokeWeight(1.5); noFill(); ellipse(-4, -18, 5, 5); ellipse(4, -18, 5, 5); line(-1, -18, 1, -18);
    } else if (skinSeleccionada === 'toji') {
        fill(200); strokeWeight(1); stroke(0); line(-6, -13, -2, -14);
    } else {
        fill(215, 255, 0); ellipse(-5, -18, 5, 7); ellipse(5, -18, 5, 7);
    }

    // Arma / Canalizador de partículas estéticas
    push(); translate(12, 4); rotate(pistolaTimer > 0 ? pistolaAngulo - 0.1 : 0);
    stroke(100); strokeWeight(4); line(0, 0, 12, 0);
    pop();
    
    pop();
}

// --- CINEMÁTICA ANIME: GOJO VS MAHORAGA ---
function actualizarNuevaAnimacionAnime() {
    animacionFrame++;
    background(10, 10, 15);
    gatoX = ancho / 2;
    renderizarDiseñoGatoEvolucionado();

    if (animacionFrame < 60) {
        azulY = lerp(azulY, 150, 0.1);
        fill(0, 100, 255, 200 + sin(frameCount * 0.5) * 55); noStroke();
        ellipse(azulX, azulY, 24, 24);
        stroke(0, 150, 255, 100); strokeWeight(2); line(ancho/2, gatoY - 30, azulX, azulY);
    } 
    else if (animacionFrame >= 60 && animacionFrame < 130) {
        fill(0, 100, 255); ellipse(azulX, azulY, 24, 24);
        cinemanticaMahoY = lerp(cinemanticaMahoY, 140, 0.07);
        cinemanticaMahoX = azulX + sin(frameCount * 0.2) * 15; 
        
        fill(230, 230, 220); stroke(50); strokeWeight(1); ellipse(cinemanticaMahoX, cinemanticaMahoY, 32, 32);
        push(); translate(cinemanticaMahoX, cinemanticaMahoY - 25); rotate(frameCount * 0.1);
        stroke(200, 150, 50); strokeWeight(3); noFill(); ellipse(0, 0, 24, 24);
        for(let i=0; i<4; i++) { rotate(PI/2); line(0, 0, 12, 0); } pop();
    } 
    else if (animacionFrame >= 130 && animacionFrame < 190) {
        fill(0, 100, 255); ellipse(azulX, azulY, 24, 24);
        fill(230, 230, 220); ellipse(cinemanticaMahoX, cinemanticaMahoY, 32, 32);

        rojoY = lerp(rojoY, cinemanticaMahoY, 0.18);
        fill(255, 30, 60); noStroke(); ellipse(rojoX, rojoY, 20, 20);
        if (dist(rojoX, rojoY, cinemanticaMahoX, cinemanticaMahoY) < 25) { cinemanticaMahoX += random(-5, 5); background(255, 100, 100, 50); }
    } 
    else if (animacionFrame >= 190 && animacionFrame < 260) {
        azulY = lerp(azulY, 180, 0.05); rojoY = lerp(rojoY, 180, 0.05);
        fill(0, 100, 255, 150); ellipse(azulX, azulY, 30, 30);
        fill(255, 30, 60, 150); ellipse(rojoX, rojoY, 30, 30);
        if (animacionFrame > 210) {
            fill(160, 0, 255); ellipse(ancho/2, 180, (animacionFrame - 210) * 1.5, (animacionFrame - 210) * 1.5);
            if (frameCount % 4 === 0) sonarSFX('purpura');
        }
    } 
    else if (animacionFrame >= 260 && animacionFrame < 330) {
        explosionRadio += 18;
        fill(140, 0, 255, 240); noStroke(); ellipse(ancho/2, 180, explosionRadio);
        if (explosionRadio > ancho * 2.5) { ejecutandoAnimacion = false; faseLastBreath = true; resetFase2(); }
    }
}

// --- COMBATE CONTRA SUKUNA (LAST BREATH BOSS) ---
function logicaCombateSukuna() {
    background(10, 5, 8); 
    
    if (bossHP > 80) jefeFaseActual = 1;
    else if (bossHP > 60 && bossHP <= 80) jefeFaseActual = 2;
    else if (bossHP > 40 && bossHP <= 60) jefeFaseActual = 3;
    else if (bossHP > 20 && bossHP <= 40) jefeFaseActual = 4;
    else if (bossHP <= 20) jefeFaseActual = 5;

    if (bossHP <= 35 && !yaAlcanzoMitadVida) yaAlcanzoMitadVida = true;

    for (let i = balas.length - 1; i >= 0; i--) {
        let b = balas[i];
        if (b.tipo === "rayoBlanco") {
            push(); translate(b.origenX, b.origenY); rotate(b.angulo);
            fill(230, 240, 255, b.alfa); noStroke(); rectMode(CENTER);
            rect(500, 0, 1000, blasterAnchoLaser * (b.alfa / 255));
            fill(180, 210, 255, b.alfa * 0.7); rect(500, 0, 1000, 12); 
            pop();

            let dLin = v_distanciaPuntoLinea(gatoX, gatoY, b.origenX, b.origenY, b.angulo);
            if (b.alfa > 80 && dLin < (blasterAnchoLaser / 2 - 4)) {
                gatoHP -= modoFuriaActivo ? 0.5 : 1.3; sonarSFX('daño'); if (gatoHP <= 0) verficarMuerteGato();
            }
            b.alfa -= 18; if (b.alfa <= 0) balas.splice(i, 1);
        }
    }

    for (let bl of blastersLista) {
        stroke(255, 40, 40, 180); strokeWeight(1.5);
        push(); translate(bl.x, bl.y); rotate(bl.ang); line(0, 0, 0, -1000); pop();
        fill(200, 30, 30); noStroke(); ellipse(bl.x, bl.y, 10, 10);
    }

    noFill(); stroke(jefeFaseActual === 5 ? color(255, 0, 0) : color(180, 40, 40)); strokeWeight(4);
    rectMode(CORNER); rect(cajaX, cajaY, cajaW, cajaH);

    push(); translate(gatoX, gatoY);
    if (usarGravedad) fill(0, 120, 255); else fill(160, 30, 255);
    noStroke(); beginShape(); vertex(0, -6); bezierVertex(-7, -13, -14, -5, 0, 8); bezierVertex(14, -5, 7, -13, 0, -6); endShape(CLOSE);
    pop();

    bossX = ancho / 2 + sin(frameCount * 0.07) * 45;
    push(); translate(bossX, bossY);
    fill(25, 20, 25); stroke(180, 20, 40); strokeWeight(3); rectMode(CENTER); rect(0, 0, 55, 55, 6);
    fill(255, 0, 30); noStroke(); ellipse(-10, -8, 4, 4); ellipse(-10, -2, 4, 4); ellipse(10, -8, 4, 4); ellipse(10, -2, 4, 4);
    pop();
    
    rectMode(CORNER);
    fill(30); rect(ancho/2 - 50, bossY - 50, 100, 6);
    fill(190, 10, 35); rect(ancho/2 - 50, bossY - 50, constrain(bossHP, 0, 100), 6);

    if (bossMensajeTimer > 0) {
        bossMensajeTimer--; fill(255); rect(bossX + 40, bossY - 30, 120, 35, 5);
        fill(0); textSize(9); textAlign(CENTER, CENTER); text(bossMensaje, bossX + 100, bossY - 12);
    }

    if (juegoVivo) {
        if (mouseIsPressed && !(!turnoJefe && mouseY < UT_barraY + UT_barraH + 20 && mouseY > UT_barraY - 20)) {
            if (usarGravedad) {
                gatoX = lerp(gatoX, mouseX, 0.25); botonPresionadoTiempo++;
                if (botonPresionadoTiempo === 1 && gatoY >= cajaY + cajaH - 12) { gatoVy = saltoFuerzaMax * 0.65; sonarSFX('salto'); }
                else if (botonPresionadoTiempo > 1 && botonPresionadoTiempo < 15 && gatoVy < 0) { gatoVy -= 0.38; }
            } else { gatoX = lerp(gatoX, mouseX, 0.25); gatoY = lerp(gatoY, mouseY, 0.25); }
        } else { botonPresionadoTiempo = 0; }

        if (usarGravedad) {
            gatoVy += gravedadPoder; gatoY += gatoVy;
            if (gatoY >= cajaY + cajaH - 10) { gatoY = cajaY + cajaH - 10; gatoVy = 0; }
        }

        gatoX = constrain(gatoX, cajaX + 10, cajaX + cajaW - 10);
        gatoY = constrain(gatoY, cajaY + 10, cajaY + cajaH - 10);

        if (turnoJefe) {
            ataqueTimer++; ejecutarPatronesAtaqueSukuna(jefeFaseActual);
            if (ataqueTimer > 250) { balas = []; blastersLista = []; usarGravedad = false; turnoJefe = false; UT_ataqueDetenido = false; UT_lineaX = UT_barraX; UT_resultadoTexto = ""; }
        } else {
            fill(20); stroke(240); rect(UT_barraX, UT_barraY, UT_barraW, UT_barraH, 4);
            fill(160, 0, 255); noStroke(); rect(UT_barraX + UT_barraW / 2 - 15, UT_barraY, 30, UT_barraH);

            if (!UT_ataqueDetenido) {
                UT_lineaX += UT_lineaVel;
                if (UT_lineaX > UT_barraX + UT_barraW) { UT_ataqueDetenido = true; UT_resultadoTexto = "Fallo..."; UT_resultadoTimer = 45; }
            }
            stroke(255); strokeWeight(4); line(UT_lineaX, UT_barraY, UT_lineaX, UT_barraY + UT_barraH);
            fill(255, 180, 0); noStroke(); textAlign(CENTER); textSize(11); text("¡GOLPEA CON TODO EL PODER ACUMULADO!", ancho/2, UT_barraY - 15);

            if (UT_resultadoTimer > 0) {
                UT_resultadoTimer--;
                textSize(14); fill(255, 215, 0); textStyle(BOLD); text(UT_resultadoTexto, ancho/2, UT_barraY + UT_barraH + 20); textStyle(NORMAL);
                if (UT_resultadoTimer === 0) { turnoJefe = true; ataqueTimer = 0; seleccionarMensajeSukuna(); }
            }
        }

        for (let i = balas.length - 1; i >= 0; i--) {
            let b = balas[i]; if (b.tipo === "rayoBlanco") continue;
            b.x += b.vx || 0; b.y += b.vy || 0;

            if (b.tipo === "fuga") {
                fill(255, 140, 0); noStroke(); ellipse(b.x, b.y, 14, 14); fill(255, 230, 0); ellipse(b.x, b.y, 8, 8);
                if (dist(b.x, b.y, gatoX, gatoY) < 13) { gatoHP -= modoFuriaActivo ? 0.7 : 1.6; balas.splice(i, 1); sonarSFX('daño'); if (gatoHP <= 0) verficarMuerteGato(); continue; }
            } else if (b.tipo === "hueso") { 
                stroke(200); strokeWeight(2); fill(240, 240, 255); rect(b.x, b.y, b.w, b.h, 1);
                if (gatoX + 6 > b.x && gatoX - 6 < b.x + b.w && gatoY + 6 > b.y && gatoY - 6 < b.y + b.h) { gatoHP -= modoFuriaActivo ? 0.6 : 1.5; balas.splice(i, 1); sonarSFX('daño'); if (gatoHP <= 0) verficarMuerteGato(); continue; }
            }
            if (b.y > cajaY + cajaH + 25 || b.y < cajaY - 25 || b.x < cajaX - 25 || b.x > cajaX + cajaW + 25) balas.splice(i, 1);
        }

        for (let i = misilesPropios.length - 1; i >= 0; i--) {
            let m = misilesPropios[i]; m.y += m.vy;
            stroke(160, 0, 255); strokeWeight(4); line(m.x, m.y, m.x, m.y + 10);
            if (m.y < bossY + 20) {
                if (random() < 0.1) { bossMensaje = "Aburrido..."; bossMensajeTimer = 45; } 
                else { bossHP -= m.daño; crearChispas(bossX, bossY); sonarSFX('laser'); if (bossHP <= 0) { faseLastBreath = false; puntos += 5000; puntosTotalesBanco += puntos; estadoPantalla = 'menu'; } }
                misilesPropios.splice(i, 1);
            }
        }
    } else {
        fill(255, 0, 0); textAlign(CENTER); textStyle(BOLD); text("FIN DEL JUEGO\nToca para ir al menú", ancho/2, alto/2);
    }

    fill(255); textAlign(CENTER); textSize(12); text("SUKUNA - HP: " + floor(bossHP) + " / 100", ancho/2, cajaY - 15); text("TU VIDA: " + floor(gatoHP) + " / " + gatoHPMax, ancho/2, cajaY + cajaH + 30);
}

function ejecutarPatronesAtaqueSukuna(fase) {
    if (fase === 1) {
        if (ataqueTimer % 35 === 10) { blastersLista = [{ x: random(cajaX, cajaX + cajaW), y: cajaY - 20, ang: atan2(gatoY - (cajaY - 20), gatoX - random(cajaX, cajaX + cajaW)) + HALF_PI }]; }
        if (ataqueTimer % 35 === 30 && blastersLista.length > 0) { for (let bl of blastersLista) dispararLaserTriangulo(bl.x, bl.y, bl.ang - HALF_PI); blastersLista = []; sonarSFX('corte'); }
    } 
    else if (fase === 2) {
        if (ataqueTimer % 50 === 10) { blastersLista = [{ x: cajaX - 10, y: random(cajaY, cajaY + cajaH), ang: HALF_PI }, { x: cajaX + cajaW + 10, y: random(cajaY, cajaY + cajaH), ang: -HALF_PI }]; }
        if (ataqueTimer % 50 === 45) { for (let bl of blastersLista) dispararLaserTriangulo(bl.x, bl.y, bl.ang - HALF_PI); blastersLista = []; sonarSFX('corte'); }
    } 
    else if (fase === 3) {
        usarGravedad = true; if (ataqueTimer % 30 === 0) { balas.push({ x: random(cajaX + 10, cajaX + cajaW - 10), y: cajaY - 10, vx: 0, vy: 4.5, tipo: "fuga" }); sonarSFX('fuga'); }
    } 
    else if (fase === 4) {
        usarGravedad = false; frenesiAngular += 0.12;
        if (ataqueTimer % 18 === 0) { let cx = cajaX + cajaW / 2, cy = cajaY + cajaH / 2; let bx = cx + cos(frenesiAngular) * 110, by = cy + sin(frenesiAngular) * 110; dispararLaserTriangulo(bx, by, atan2(cy - by, cx - bx)); sonarSFX('corte'); }
    } 
    else if (fase === 5) {
        frenesiAngular += 0.18;
        if (ataqueTimer % 12 === 0) {
            let cx = cajaX + cajaW / 2, cy = cajaY + cajaH / 2; let bx = cx + cos(frenesiAngular) * 95, by = cy + sin(frenesiAngular) * 95; dispararLaserTriangulo(bx, by, atan2(gatoY - by, gatoX - bx));
            if (random() < 0.4) { balas.push({ x: random(cajaX, cajaX + cajaW), y: cajaY - 10, vx: random(-1, 1), vy: 5, tipo: "fuga" }); }
            sonarSFX('corte');
        }
    }
}

function dispararLaserTriangulo(ox, oy, angulo) { balas.push({ tipo: "rayoBlanco", origenX: ox, origenY: oy, angulo: angulo, alfa: 255 }); }
function v_distanciaPuntoLinea(px, py, lx, ly, angulo) { let dx = cos(angulo), dy = sin(angulo); return abs(dy * px - dx * py + lx * (py + dy) - ly * (px + dx)) / sqrt(dy * dy + dx * dx); }

function verficarMuerteGato() {
    if (yaAlcanzoMitadVida && !modoFuriaActivo) { ejecutandoAnimacionMuerteFuria = true; animMuerteTimer = 0; } 
    else { juegoVivo = false; puntosTotalesBanco += puntos; sonarSFX('gameover'); }
}

function crearChispas(x, y) {
    let rCol = {r: 255, g: 215, b: 0};
    if (skinSeleccionada === 'gojo') rCol = {r: 180, g: 0, b: 255};
    else if (skinSeleccionada === 'yuji') rCol = {r: 240, g: 120, b: 140};
    else if (skinSeleccionada === 'megumi') rCol = {r: 50, g: 50, b: 150};
    for (let i = 0; i < 6; i++) {
        chispas.push({ x: x, y: y, vx: random(-3, 3), vy: random(-3, 3), color: rCol, alfa: 240, tam: random(2, 4) });
    }
}

function destruirJefe(idx) { sonarSFX('vencerJefe'); objetivos.splice(idx, 1); jefe = null; puntos += 100; puntosGlobalesTotal += 100; }
function dibujarBoton(x, y, w, h, texto, costo, comprado) { fill(comprado ? color(35, 110, 55) : color(90, 45, 140)); noStroke(); rect(x, y, w, h, 8); fill(255); textAlign(CENTER, CENTER); textSize(11); textStyle(BOLD); text(texto, x + w/2, y + h/2); }

function seleccionarMensajeSukuna() {
    bossMensajeTimer = 90;
    let frases = ["¿Ese es todo tu infinito?", "¡Eres débil, mocoso!", "¡Te partiré en dos!", "Gojo Satoru ya no está aquí.", "¡Escala el abismo!"];
    bossMensaje = frases[floor(random(frases.length))];
}

function resetFase2() {
    gatoX = cajaX + cajaW / 2; gatoY = cajaY + cajaH / 2; balas = []; misilesPropios = []; blastersLista = [];
    turnoJefe = true; ataqueTimer = 0; usarGravedad = false; gatoVy = 0; seleccionarMensajeSukuna(); jefeFaseActual = 1; indiceNotaMusica = 0; UT_ataqueDetenido = false; UT_lineaX = UT_barraX;
    if (modoFuriaActivo) { gatoHP = 60; gatoHPMax = 60; } else { bossHP = 100; gatoHP = 30; gatoHPMax = 30; }
}

function actualizarAnimacionMuerteFuria() {
    background(5, 5, 12); animMuerteTimer++;
    let cX = cajaX + cajaW / 2, cY = cajaY + cajaH / 2;
    if (animMuerteTimer < 60) { push(); translate(cX, cY); fill(160, 30, 255); noStroke(); beginShape(); vertex(0, -6); bezierVertex(-7, -13, -14, -5, 0, 8); bezierVertex(14, -5, 7, -13, 0, -6); endShape(CLOSE); pop(); } 
    else if (animMuerteTimer >= 60 && animMuerteTimer < 120) {
        push(); translate(cX - 6, cY); fill(160, 30, 255); noStroke(); beginShape(); vertex(0, -6); bezierVertex(-7, -13, -14, -5, 0, 8); endShape(CLOSE); pop();
        push(); translate(cX + 6, cY); fill(160, 30, 255); noStroke(); beginShape(); vertex(0, -6); bezierVertex(14, -5, 7, -13, 0, 8); endShape(CLOSE); pop();
    } else { modoFuriaActivo = true; ejecutandoAnimacionMuerteFuria = false; resetFase2(); }
}

function mousePressed() {
    if (estadoPantalla === 'menu') {
        if (mouseX > 60 && mouseX < 300 && mouseY > 260 && mouseY < 310) { iniciarPartidaLimpia(); estadoPantalla = 'juego'; }
        else if (mouseX > 60 && mouseX < 300 && mouseY > 330 && mouseY < 380) estadoPantalla = 'tienda';
        else if (mouseX > 60 && mouseX < 300 && mouseY > 400 && mouseY < 450) estadoPantalla = 'skins';
        return;
    }
    if (estadoPantalla === 'tienda') {
        if (mouseX > 30 && mouseX < 330 && mouseY > 140 && mouseY < 220 && !tieneEscudo1_Disponible && puntosTotalesBanco >= 15) { puntosTotalesBanco -= 15; tieneEscudo1_Disponible = true; }
        if (mouseX > 30 && mouseX < 330 && mouseY > 240 && mouseY < 320 && !tieneEscudo2_Disponible && puntosTotalesBanco >= 30) { puntosTotalesBanco -= 30; tieneEscudo2_Disponible = true; }
        if (mouseX > 60 && mouseX < 300 && mouseY > 540 && mouseY < 585) estadoPantalla = 'menu';
        return;
    }
    if (estadoPantalla === 'skins') {
        if (mouseX > 40 && mouseX < ancho - 40) {
            if (mouseY > 75 && mouseY < 135) skinSeleccionada = 'normal';
            if (mouseY > 140 && mouseY < 200) skinSeleccionada = 'gojo';
            if (mouseY > 205 && mouseY < 265) skinSeleccionada = 'yuji';
            if (mouseY > 270 && mouseY < 330) skinSeleccionada = 'megumi';
            if (mouseY > 335 && mouseY < 395) skinSeleccionada = 'nobara';
            if (mouseY > 400 && mouseY < 460) skinSeleccionada = 'nanami';
            if (mouseY > 465 && mouseY < 525) skinSeleccionada = 'maki';
            if (mouseY > 530 && mouseY < 590) skinSeleccionada = 'toji';
        }
        if (mouseX > 60 && mouseX < 300 && mouseY > 600 && mouseY < 632) estadoPantalla = 'menu';
        return;
    }
    if (estadoPantalla === 'juego') {
        if (faseLastBreath) {
            if (!juegoVivo) { estadoPantalla = 'menu'; return; }
            if (!turnoJefe && !UT_ataqueDetenido) {
                UT_ataqueDetenido = true; UT_resultadoTimer = 45;
                let centroBarra = UT_barraX + UT_barraW / 2; let distC = abs(UT_lineaX - centroBarra);
                let dmg = modoFuriaActivo ? 4 : 2; if (balasEsquivadasContador > 0) dmg += (balasEsquivadasContador * 0.4);
                if (distC < 20) { UT_resultadoTexto = "¡CRÍTICO NEGRO x2!"; dmg *= 2; sonarSFX('purpura'); } 
                else { UT_resultadoTexto = "Impacto Seguro"; sonarSFX('corte'); }
                balasEsquivadasContador = 0; misilesPropios.push({ x: gatoX, y: gatoY - 10, vx: 0, vy: -12, daño: dmg });
            }
            return;
        }
        if (mouseY > alto - 100) { if (tieneEscudo1_Disponible && !escudoActivo) { escudoActivo = true; tiempoEscudoRestante = 300; } } 
        else if (juegoVivo) {
            for (let o of objetivos) { if (dist(mouseX, mouseY, o.x, o.y) < (o.esJefe ? o.w/2 + 30 : o.r + 30)) { if (balasEsquivadasContador > 0 && rafagaPendiente === 0) { objetivoAsignado = o; rafagaPendiente = 4; } break; } }
        } else { estadoPantalla = 'menu'; }
    }
}

function iniciarPartidaLimpia() {
    juegoVivo = true; puntos = 0; balasEsquivadasContador = 0; balasEsquivadasTotal = 0; balas = []; objetivos = []; misilesPropios = []; chispas = []; jefe = null; temporizadorJefe = 0; escudoActivo = false; gatoX = ancho / 2; puntosGlobalesTotal = 0; faseLastBreath = false; bossHP = 100; yaAlcanzoMitadVida = false; modoFuriaActivo = false;
}
</script>
